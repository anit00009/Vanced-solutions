<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Admin | Vanced Solutions</title>
  <meta name="description" content="Create and manage Vanced Solutions blog posts." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="Images/favicon.png">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center gap-2">
        <div class="company-logo">
          <a href="index.html">
            <img src="Images/vanced-logo2.png" alt="Vanced Solutions - Blog CMS Admin" height="40" />
          </a>
        </div>
        <div class="header-actions d-flex align-items-center gap-3">
          <a href="blog.html" class="booking-btn d-none d-sm-block">View Blog</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="bg-soft-gray">
      <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-4 mb-48">
          <div>
            <span class="badge-item card_one fs-12 fw-semibold mb-24">Blog CMS</span>
            <h1 class="main-heading fs-72 mb-24">Publish <span>Blog Posts</span></h1>
            <p class="fs-18 text-gray mb-0 max-w-600">
              Add, edit, and publish articles into the JSON file that powers the public blog.
            </p>
          </div>
          <a href="blog.html" class="link-btn fw-bold text-decoration-none">Open Blog <i class="fa-solid fa-arrow-right ms-1"></i></a>
        </div>

        <div class="blog-admin-layout">
          <form class="blog-admin-panel" data-blog-admin-form>
            <input type="hidden" name="id" />
            <div class="field-group">
              <label>ADMIN PASSWORD</label>
              <input name="password" type="password" placeholder="Required to publish on hosting" />
            </div>
            <div class="field-group">
              <label>TITLE</label>
              <input name="title" type="text" placeholder="Blog post title" required />
            </div>
            <div class="form-row">
              <div class="field-group">
                <label>CATEGORY</label>
                <input name="category" type="text" placeholder="Future Tech" required />
              </div>
              <div class="field-group">
                <label>DATE</label>
                <input name="date" type="date" required />
              </div>
            </div>
            <div class="form-row">
              <div class="field-group">
                <label>AUTHOR</label>
                <input name="author" type="text" value="Vanced Solutions" required />
              </div>
              <div class="field-group">
                <label>READ TIME</label>
                <input name="readTime" type="text" value="5 min read" required />
              </div>
            </div>
            <div class="field-group">
              <label>IMAGE URL</label>
              <input name="image" type="text" placeholder="Images/en-insight-img1.png" required />
            </div>
            <div class="field-group">
              <label>EXCERPT</label>
              <textarea name="excerpt" placeholder="Short summary shown on the blog listing" required></textarea>
            </div>
            <div class="field-group">
              <label>CONTENT</label>
              <textarea name="content" class="blog-content-input" placeholder="Write paragraphs separated by a blank line" required></textarea>
            </div>
            <div class="d-flex flex-wrap gap-3">
              <button type="submit" class="booking-btn">Publish Post</button>
              <button type="button" class="light-btn" data-admin-reset>New Draft</button>
            </div>
            <p class="admin-status fs-14 mb-0" data-admin-status></p>
          </form>

          <aside class="blog-admin-panel">
            <h2 class="fs-24 fw-bold mb-24">Current Posts</h2>
            <div class="admin-post-list" data-admin-posts></div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
